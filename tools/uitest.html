<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>UI 交互测试</title>
<style>body{font:13px monospace;margin:0}iframe{width:390px;height:844px;border:0;position:absolute;right:-9999px}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running...</pre>
<iframe id="f" src="../app/src/main/assets/www/index.html"></iframe>
<script>
(function () {
  var lines = [], fails = 0;
  function ok(cond, msg) { lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg); if (!cond) fails++; }
  function info(msg) { lines.push('      ' + msg); }

  var frame = document.getElementById('f');
  var doc, win;

  /* 支持 ?w=360&h=640 指定被测视口尺寸，用于多机型布局回归 */
  var qs = (location.search || '').replace(/^\?/, '').split('&');
  var vw0 = 390, vh0 = 844;
  for (var qi = 0; qi < qs.length; qi++) {
    var kv = qs[qi].split('=');
    if (kv[0] === 'w') vw0 = Number(kv[1]);
    if (kv[0] === 'h') vh0 = Number(kv[1]);
  }
  frame.style.width = vw0 + 'px';
  frame.style.height = vh0 + 'px';

  function $(id) { return doc.getElementById(id); }
  function click(el) {
    var ev = doc.createEvent('MouseEvents');
    ev.initMouseEvent('click', true, true, win, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
    el.dispatchEvent(ev);
  }
  function clickChip(group, value) {
    var list = doc.querySelectorAll('[data-group="' + group + '"]');
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-value') === String(value)) { click(list[i]); return true; }
    }
    return false;
  }
  function clickAcc(v) {
    click(doc.querySelector('#accChips [data-acc="' + v + '"]'));
  }
  function closeSheetIfOpen() {
    if (doc.getElementById('sheet') && doc.getElementById('sheet').classList.contains('open')) {
      click(doc.getElementById('sheetDone'));
    }
  }
  function chipExists(group, value) {
    var list = doc.querySelectorAll('[data-group="' + group + '"]');
    for (var i = 0; i < list.length; i++) if (list[i].getAttribute('data-value') === String(value)) return true;
    return false;
  }

  frame.onload = function () {
    try {
      doc = frame.contentDocument;
      win = frame.contentWindow;

      /* --- 1. 初始状态 --- */
      ok($('chordName').textContent === 'C', '初始和弦名 = C （实际 ' + $('chordName').textContent + '）');
      ok($('chordRoman').textContent.indexOf('I 级') === 0, '初始级数标注 = I 级（实际 ' + $('chordRoman').textContent + '）');
      ok($('chordNotes').textContent.indexOf('C(1)') === 0, '组成音显示：' + $('chordNotes').textContent);
      var st = win.CHORD_STATE;
      ok(st.voicings.length > 50, '初始指法数 ' + st.voicings.length);
      ok(doc.querySelectorAll('.pos-group').length >= 10, '把位分组 ' + doc.querySelectorAll('.pos-group').length + ' 组');
      ok(doc.querySelectorAll('.card').length > 0, '首屏已渲染卡片 ' + doc.querySelectorAll('.card').length + ' 张');
      var neck = doc.querySelector('#neckBox svg');
      ok(!!neck, '指板 SVG 已生成');
      ok(neck && Number(neck.getAttribute('width')) > 1000, '指板宽度 ' + (neck ? neck.getAttribute('width') : '-') + 'px（24 品）');
      var dots = doc.querySelectorAll('#neckBox .nk-dot');
      ok(dots.length >= 3, '指板上高亮 ' + dots.length + ' 个按弦点（x32010 = 3 个）');
      ok(doc.querySelector('#neckInfo').textContent.indexOf('x 3 2 0 1 0') > -1, '默认指法 = ' + doc.querySelector('#neckInfo').textContent);
      var cagedCards = doc.querySelectorAll('#cagedRow .caged-card');
      ok(cagedCards.length === 5, 'CAGED 默认展示 5 个代表指型');
      var cagedIds = '';
      for (var cc = 0; cc < cagedCards.length; cc++) cagedIds += cagedCards[cc].getAttribute('data-caged');
      ok(cagedIds === 'CAGED', 'CAGED 顺序 = ' + cagedIds);
      ok(cagedCards[0].querySelector('.caged-root').textContent.indexOf('根音 5 弦 3 品') >= 0,
         'C 型标记根音位置：' + cagedCards[0].querySelector('.caged-root').textContent);
      ok($('allVoicings').open === false, '全部上百个指法默认折叠，不干扰 CAGED');
      ok(cagedCards[0].classList.contains('on'), '当前 C 型卡片高亮');
      click(cagedCards[3]);
      var cagedE = st.voicings[st.selected];
      ok(win.Chord.tabString(cagedE) === '8 10 10 9 8 8',
         '点 E 型会把指板切到该指型：' + win.Chord.tabString(cagedE));
      ok($('neckInfo').textContent.indexOf('8 10 10 9 8 8') >= 0, '指板读数同步 E 型');

      /* --- 2. 换主调 --- */
      clickChip('key', 2);
      ok($('chordName').textContent === 'D', '切到 D 调 → ' + $('chordName').textContent);
      ok($('subTitle').textContent.indexOf('D 大调') === 0, '副标题 ' + $('subTitle').textContent);

      /* --- 3. 换级数 --- */
      clickChip('degree', 5);
      ok($('chordName').textContent === 'A', 'D 调 5 级 → ' + $('chordName').textContent);
      clickChip('degree', 2);
      ok($('chordName').textContent === 'Em' || $('chordName').textContent === 'E', 'D 调 2 级 → ' + $('chordName').textContent);

      /* --- 4. 变音 --- */
      clickChip('degree', 3);
      clickAcc(-1);
      ok($('chordName').textContent === 'F', 'D 调 ♭3 级 → ' + $('chordName').textContent + '（应为 F）');
      clickAcc(0);
      ok($('chordName').textContent === 'F#', '恢复本音 → ' + $('chordName').textContent);

      /* --- 5. 和弦属性 --- */
      var qBefore = st.voicings.length;
      ok(clickChip('quality', 'm7'), '点击 m7 属性 chip');
      ok($('chordName').textContent === 'F#m7', '♮3 级 + 小七 → ' + $('chordName').textContent);
      ok(st.voicings.length !== qBefore, '换属性后指法数变化 ' + qBefore + ' → ' + st.voicings.length);
      clickChip('quality', 'maj7');
      ok($('chordName').textContent === 'F#maj7', '大七 → ' + $('chordName').textContent);

      /* --- 6. 调内和弦快捷查询 --- */
      clickChip('key', 0);
      clickChip('quality', 'maj');
      var dia = doc.querySelectorAll('[data-group="diatonic"]');
      ok(dia.length === 7, '调内和弦 chip 数量 = ' + dia.length);
      info('调内和弦：' + (function () {
        var s = [];
        for (var i = 0; i < dia.length; i++) s.push(dia[i].textContent);
        return s.join(' | ');
      })());
      click(dia[4]);   /* V 级 */
      ok($('chordName').textContent === 'G', '点调内 V 级 → ' + $('chordName').textContent);
      ok($('chordRoman').textContent.indexOf('V 级') === 0, '级数标注 ' + $('chordRoman').textContent);
      /* 切七和弦再点 V */
      click($('btnDiatonic7'));
      var dia7 = doc.querySelectorAll('[data-group="diatonic"]');
      info('调内七和弦：' + (function () {
        var s = [];
        for (var i = 0; i < dia7.length; i++) s.push(dia7[i].textContent);
        return s.join(' | ');
      })());
      click(dia7[4]);
      ok($('chordName').textContent === 'G7', '七和弦模式点 V 级 → ' + $('chordName').textContent);
      click($('btnDiatonic7'));

      /* --- 7. 点击卡片选中 + 指板跟随 --- */
      clickChip('key', 0);
      clickChip('degree', 1);
      clickChip('quality', 'maj');
      var cards = doc.querySelectorAll('.card');
      var target = cards[Math.min(3, cards.length - 1)];
      var targetIndex = target.getAttribute('data-index');
      click(target);
      ok(target.classList.contains('on'), '被点击的卡片高亮');
      ok(Number(st.selected) === Number(targetIndex), '选中下标更新为 ' + st.selected);
      var tabAfter = $('neckInfo').textContent;
      ok(tabAfter.length > 0, '指板信息更新：' + $('voicingLabel').textContent + ' / ' + tabAfter);

      /* --- 8. 上一个 / 下一个指法 --- */
      var before = st.selected;
      click($('btnNext'));
      ok(st.selected !== before, '“下一个”切换选中：' + before + ' → ' + st.selected);
      click($('btnPrev'));
      ok(Number(st.selected) === Number(before), '“上一个”切回：' + st.selected);

      /* --- 9. 设置项 --- */
      var allCount = st.voicings.length;
      clickChip('maxFret', 12);
      ok(st.maxFret === 12, '最大品切到 12');
      var over = 0;
      for (var i = 0; i < st.voicings.length; i++) {
        for (var s = 0; s < 6; s++) if (st.voicings[i].frets[s] > 12) over++;
      }
      ok(over === 0, '12 品限制下无越界指法（' + st.voicings.length + ' 个，原 ' + allCount + ' 个）');
      clickChip('maxFret', 24);

      var n1 = st.voicings.length;
      clickChip('minSounding', 6);
      ok(st.voicings.length < n1 && st.voicings.length > 0, '最少发声 6 弦 → ' + st.voicings.length + ' 个指法');
      clickChip('minSounding', 4);

      clickChip('span', 3);
      var spanOk = true;
      for (i = 0; i < st.voicings.length; i++) if (st.voicings[i].spanUsed > 3) spanOk = false;
      ok(spanOk, '跨度 3 限制生效（' + st.voicings.length + ' 个指法）');
      clickChip('span', 4);

      clickChip('compact', 'true');
      var rendered = 0, groups = doc.querySelectorAll('.pos-group').length;
      rendered = doc.querySelectorAll('.card').length;
      ok(doc.querySelectorAll('.card').length <= groups, '精简模式：' + groups + ' 组 / ' + rendered + ' 张卡片');
      clickChip('compact', 'false');

      clickChip('labelMode', 'note');
      var noteTexts = doc.querySelectorAll('.card .cb-dot-text');
      ok(noteTexts.length > 0, '音名标注模式生效（首个标注 ' + (noteTexts[0] ? noteTexts[0].textContent : '-') + '）');
      clickChip('labelMode', 'finger');

      clickChip('range', '0-4');
      var posHeads = doc.querySelectorAll('.pos-head strong');
      var allLow = true;
      for (i = 0; i < posHeads.length; i++) {
        var m = posHeads[i].textContent.match(/第 (\d+) 把位/);
        if (m && Number(m[1]) > 4) allLow = false;
      }
      ok(allLow && posHeads.length > 0, '品域过滤 0-4 生效：' + posHeads.length + ' 组');
      var rg = doc.querySelector('[data-group="range"][data-value="0-4"]');
      ok(rg && rg.classList.contains('on'), '品域筛选 chip 高亮跟随（0-4 品）');
      clickChip('range', 'all');
      ok(doc.querySelector('[data-group="range"][data-value="all"]').classList.contains('on'), '切回“全部”后高亮跟随');

      /* --- 10. 开关 --- */
      var bassOff = st.voicings.length;
      var chk = $('chkBassRoot');
      chk.checked = false;
      var ev = doc.createEvent('HTMLEvents'); ev.initEvent('change', true, false); chk.dispatchEvent(ev);
      ok(st.voicings.length > bassOff, '关闭“低音为根音” → ' + bassOff + ' 增至 ' + st.voicings.length);
      chk.checked = true; chk.dispatchEvent(ev);
      var allTones = $('chkAllTones');
      allTones.checked = true;
      allTones.dispatchEvent(ev);
      ok(doc.querySelectorAll('#neckBox .nk-faint').length > 10, '显示全部和弦音：' + doc.querySelectorAll('#neckBox .nk-faint').length + ' 个淡色点');
      allTones.checked = false; allTones.dispatchEvent(ev);

      /* --- 11. 升降号拼写切换 --- */
      clickChip('key', 6);   /* F# / Gb */
      var name1 = $('chordName').textContent;
      click($('btnSpell'));
      var name2 = $('chordName').textContent;
      ok(name1 !== name2, '升降号切换：' + name1 + ' → ' + name2);

      /* --- 12. 空状态提示 --- */
      clickChip('key', 0); clickChip('degree', 1); clickChip('quality', 'maj');
      clickChip('maxFret', 12);
      clickChip('minSounding', 6);
      clickChip('span', 3);
      clickChip('range', '17-24');
      ok(doc.querySelector('.empty') !== null, '无结果时显示空状态提示');
      clickChip('range', 'all'); clickChip('maxFret', 24); clickChip('minSounding', 4); clickChip('span', 4);
      ok(doc.querySelector('.empty') === null, '恢复条件后空状态消失');

      /* --- 13. 各属性的渲染冒烟测试 --- */
      var smoke = [];
      var qualities = win.Chord.QUALITY_LIST;
      for (i = 0; i < qualities.length; i++) {
        clickChip('quality', qualities[i].id);
        var n = doc.querySelectorAll('.card').length;
        var svgOk = !!doc.querySelector('.card svg');
        if (!svgOk && st.voicings.length > 0) smoke.push(qualities[i].id + ':无SVG');
        if (st.voicings.length === 0) smoke.push(qualities[i].id + ':无指法');
      }
      ok(smoke.length === 0, '全部 ' + qualities.length + ' 种属性能正常渲染（' + (smoke.length ? smoke.join(',') : '正常') + '）');

      /* --- 14. 布局体检：不能有横向溢出，控件不能被挤出屏幕 --- */
      clickChip('key', 0); clickChip('degree', 1); clickChip('quality', 'maj');
      closeSheetIfOpen();
      var vw = win.innerWidth;
      info('视口 ' + vw + 'x' + win.innerHeight);
      var supportsVars = !!(win.CSS && win.CSS.supports && win.CSS.supports('--x', '0'));
      info('CSS 变量支持: ' + supportsVars);
      ok(doc.documentElement.scrollWidth <= vw + 1,
         '页面无横向溢出（scrollWidth=' + doc.documentElement.scrollWidth + '）');

      var toolbar = doc.querySelector('.neck-toolbar');
      info('工具条宽度 ' + Math.round(toolbar.getBoundingClientRect().width));
      var btns = ['btnSettings', 'btnPrev', 'btnNext', 'btnPlay'];
      var overflowBtn = [];
      for (i = 0; i < btns.length; i++) {
        var r = $(btns[i]).getBoundingClientRect();
        if (r.right > vw + 0.5 || r.left < -0.5 || r.width < 20) {
          overflowBtn.push(btns[i] + '(left=' + Math.round(r.left) + ',right=' + Math.round(r.right) + ')');
        }
      }
      ok(overflowBtn.length === 0, '工具条按钮都在屏幕内（' + (overflowBtn.length ? overflowBtn.join(',') : '正常') + '）');
      var tr = $('neckInfo').getBoundingClientRect();
      ok(tr.right <= vw + 0.5 && tr.width > 60, '指板信息行宽度正常（' + Math.round(tr.width) + 'px）');
      ok($('neckInfo').scrollHeight <= 30, '指板信息行只有一行（高 ' + $('neckInfo').scrollHeight + 'px）');
      ok(doc.querySelector('.neck-toolbar').scrollWidth <= toolbar.getBoundingClientRect().width + 1,
         '工具条内部没有溢出（scrollWidth=' + doc.querySelector('.neck-toolbar').scrollWidth + '）');

      var rh = doc.querySelector('.results-head');
      ok(rh.scrollWidth <= rh.getBoundingClientRect().width + 1,
         '“全部指法”计数行未溢出（' + rh.scrollWidth + ' / ' + Math.round(rh.getBoundingClientRect().width) + '）');

      /* 横向滚动容器应该只出现在指板与卡片行 */
      var overflowers = [];
      var all = doc.querySelectorAll('*');
      for (i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.scrollWidth > el.clientWidth + 2 && el.clientWidth > 0) {
          var cls = el.className || el.tagName;
          /* 故意的横向滚动容器与“省略号截断”不算溢出 */
          var intentional = String(cls).indexOf('neck-scroll') >= 0 ||
                            String(cls).indexOf('cards') >= 0 ||
                            String(cls).indexOf('chip-row') >= 0 ||
                            String(cls).indexOf('caged-row') >= 0 ||
                            String(cls).indexOf('craft-version-table-wrap') >= 0 ||
                            String(cls).indexOf('sheet-body') >= 0;
          if (!intentional) {
            var cs = win.getComputedStyle(el);
            if (cs.textOverflow === 'ellipsis') intentional = true;
          }
          if (!intentional) {
            overflowers.push(el.tagName + '.' + String(cls) + ':' + el.scrollWidth + '>' + el.clientWidth);
          }
        }
      }
      ok(overflowers.length === 0, '无意外横向溢出元素（' + (overflowers.length ? overflowers.slice(0, 5).join(' | ') : '正常') + '）');

      /* --- 15. 条件抽屉布局 --- */
      win.scrollTo(0, 0);
      click($('btnSettings'));
      ok($('sheet').classList.contains('open'), '点 ⚙ 后抽屉打开');
      var sh = $('sheet');
      var sheetH = sh.offsetHeight;
      var sheetTop = win.innerHeight - sheetH;   /* 过渡动画不影响 offsetHeight，按最终位置算 */
      info('抽屉最终高度 ' + sheetH + 'px，顶部 y=' + sheetTop + '（视口 ' + vw + 'x' + win.innerHeight + '）');
      ok(sheetH <= win.innerHeight * 0.59, '抽屉不超过 58vh（' + sheetH + 'px）');
      var neckRect = doc.querySelector('.neck-section').getBoundingClientRect();
      info('指板区域 y ' + Math.round(neckRect.top) + ' ~ ' + Math.round(neckRect.bottom));
      /* 常规手机（高 >= 660）要求整块指板都露在抽屉上方；
         极矮屏（如 320x568）允许压住最后一根弦，但至少露出工具条 + 4 根弦 */
      var tight = win.innerHeight < 660;
      var need = tight ? (44 + 4 * 24) : 0;
      ok(neckRect.bottom <= sheetTop + 1 || (tight && sheetTop - neckRect.top >= need),
         '抽屉打开时指板可见（指板底 ' + Math.round(neckRect.bottom) + '，抽屉顶 ' + sheetTop +
         '，' + (tight ? '矮屏至少需露出 ' + need + 'px' : '需完整露出') + '）');
      ok(neckRect.top >= -1, '抽屉打开时指板未被顶出屏幕（top=' + Math.round(neckRect.top) + '）');
      ok(sh.scrollWidth <= sh.offsetWidth + 1, '抽屉内部无横向溢出');
      ok(doc.querySelector('.sheet-body').scrollHeight > 0, '抽屉内容可滚动（内容高 ' + doc.querySelector('.sheet-body').scrollHeight + '）');
      click($('sheetDone'));
      ok(!$('sheet').classList.contains('open'), '点“完成”后抽屉关闭');

      /* --- 16. 试听按钮的健壮性（无声环境也不能抛错） --- */
      var audioErr = null;
      try {
        ok(win.Audio_.supported(), '浏览器/WebView 支持 WebAudio');
        click($('btnPlay'));
        /* 连点多次（模拟用户狂点）不应报错 */
        click($('btnPlay')); click($('btnPlay'));
      } catch (e) {
        audioErr = e.message;
      }
      ok(audioErr === null, '试听按钮不抛异常（' + (audioErr || '正常') + '）');
      /* 试听后界面仍可正常操作 */
      click($('btnNext'));
      ok(doc.querySelector('#neckInfo').textContent.length > 0, '试听后仍能切换指法并刷新信息行');

      /* --- 17. 调音 dialog：从设置左侧入口打开、调式表、没有麦克风时的降级 --- */
      var tunerBtn = $('btnTunerOpen');
      ok(!!tunerBtn, '顶部有调音入口');
      var headerBtns = doc.querySelectorAll('.brand .ghost-btn');
      var tunerIdx = -1, settingsIdx = -1;
      for (var hb = 0; hb < headerBtns.length; hb++) {
        if (headerBtns[hb].id === 'btnTunerOpen') tunerIdx = hb;
        if (headerBtns[hb].id === 'btnAppSettings') settingsIdx = hb;
      }
      ok(tunerIdx >= 0 && settingsIdx === tunerIdx + 1, '调音入口紧挨在设置左边');
      ok(!doc.querySelector('.tab[data-tab="tuner"]'), '调音不再占顶部页签');
      click(tunerBtn);
      ok(win.CHORD_STATE.tab === 'tuner' && doc.body.classList.contains('tuner-dialog'),
         '调音以 dialog 方式打开');
      ok(doc.getElementById('viewChord').hidden === true && doc.getElementById('viewTuner').hidden === false,
         '和弦板块隐藏、调音板块显示');
      ok(win.getComputedStyle($('viewTuner')).position === 'fixed',
         '调音 dialog 覆盖在页面之上');
      ok(win.getComputedStyle($('tabs')).display === 'none',
         '调音 dialog 打开时隐藏底部页签');
      ok($('scaleTitle').textContent.indexOf('大调') > 0, '音阶指板标题：' + $('scaleTitle').textContent);
      ok(doc.querySelectorAll('.mode-row').length === 6, '调式表分页显示（每页 6 条）');
      ok($('modeTable').querySelector('.pager-info').textContent.indexOf('共 10 条') > 0,
         '调式总数（3 个常用 + 7 个教会调式）：' + $('modeTable').querySelector('.pager-info').textContent);
      var modeSearch = $('modeTable').querySelector('.pager-search');
      var evm = doc.createEvent('HTMLEvents'); evm.initEvent('input', true, false);
      modeSearch.value = '多利亚';
      modeSearch.dispatchEvent(evm);
      ok(doc.querySelectorAll('.mode-row').length === 1, '搜索“多利亚”只剩 1 条');
      modeSearch.value = '';
      modeSearch.dispatchEvent(evm);
      ok(doc.querySelectorAll('#scaleBox .nk-scale-name').length > 50, '音阶指板带音名标注');
      /* 条件面板里跟和弦有关的项要隐藏 */
      click($('btnTunerSettings'));
      ok($('degreeField').style.display === 'none' && $('qualityField').style.display === 'none',
         '调音模式下条件面板只留主调与调式');
      ok($('sheetTitle').textContent.indexOf('主调') === 0, '面板标题改为：' + $('sheetTitle').textContent);
      /* 在调音页签下换调式，指板要跟着重画 */
      var dr = doc.querySelector('[data-group="scale"][data-value="lydian"]');
      ok(!!dr, '找到利底亚');
      click(dr);
      ok(win.CHORD_STATE.scaleId === 'lydian', '调式切到利底亚');
      ok($('scaleTitle').textContent.indexOf('利底亚') > 0, '标题更新：' + $('scaleTitle').textContent);
      ok($('modeDesc').textContent.indexOf('\u266f4') > 0, '调式说明显示特征音 ♯4');
      click($('sheetDone'));

      /* 没有麦克风/权限时的降级：给出可读的提示，而不是抛异常或白屏 */
      var micErr = null;
      try {
        click($('btnMic'));
      } catch (e) {
        micErr = e.message;
      }
      ok(micErr === null, '点“开始收音”不抛异常（' + (micErr || '正常') + '）');

      win.Crafts.editScore = function (c, text) {
        return { then: function (okFn) {
          okFn({ reply: '测试改谱完成', score: JSON.parse(JSON.stringify(c.score)) });
        } };
      };
      $('craftChatInput').value = '再轻一点';
      click($('btnCraftSend'));
      var afterChat = win.Crafts.get(craftId);
      ok(afterChat.versions.length === versionsBeforeChat + 1,
         '会话修改自动追加一个新版本');
      ok(afterChat.messages[afterChat.messages.length - 1].versionId ===
         afterChat.finalVersionId,
         '修改结果的对话消息指向最终版本');
      ok(doc.querySelectorAll('#craftMessages .version-link').length >= 2,
         '对话里的所有修改版本都能点击预览');
      win.Crafts.editScore = realEditScore;
      /* 版本超过 5 条时显示分页 */
      var pageCraft = win.Crafts.get(craftId);
      for (var pv = 0; pv < 4; pv++) {
        win.Crafts.addVersion(pageCraft, pageCraft.score, {
          label: '分页测试', note: '测试版本 ' + (pv + 4), source: 'ai'
        });
      }
      win.CraftUI.open(craftId);
      ok(doc.querySelectorAll('#craftVersions .craft-version-row').length === 5 &&
         !!doc.querySelector('#craftVersions .version-pager'),
         '版本记录按每页 5 条分页');
      var pagers = doc.querySelectorAll('#craftVersions .version-pager .mini-toggle');
      click(pagers[1]);
      ok(doc.querySelectorAll('#craftVersions .craft-version-row').length === 2,
         '翻到第二页显示剩余版本');
      $('craftMixDrums').value = '60';
      var evMixCraft = doc.createEvent('HTMLEvents'); evMixCraft.initEvent('input', true, false);
      $('craftMixDrums').dispatchEvent(evMixCraft);
      ok(Math.abs(win.Band.state.mix.drums - 0.6) < 0.001 &&
         Math.abs(win.Drums.volume() - 0.6) < 0.001,
         '作品详情可以调鼓声部音量');
      $('craftMixBacking').value = '70';
      $('craftMixBacking').dispatchEvent(evMixCraft);
      ok(Math.abs(win.Band.state.mix.backing - 0.7) < 0.001,
         '作品详情可以调伴奏声部音量');
      $('craftMixSolo').value = '150';
      $('craftMixSolo').dispatchEvent(evMixCraft);
      ok(Math.abs(win.Band.state.mix.solo - 1.5) < 0.001,
         '作品详情可以调 solo 声部音量');
      /* 还原默认，避免影响后面的伴奏测试 */
      $('craftMixDrums').value = '80';
      $('craftMixDrums').dispatchEvent(evMixCraft);
      $('craftMixBacking').value = '100';
      $('craftMixBacking').dispatchEvent(evMixCraft);
      $('craftMixSolo').value = '120';
      $('craftMixSolo').dispatchEvent(evMixCraft);
      click($('btnCraftBack'));
      ok($('viewWorks').hidden === false && $('viewCraft').hidden === true,
         '作品详情可以返回作品库');
      ok(!doc.body.classList.contains('craft-view') &&
         win.getComputedStyle(doc.querySelector('#tabs')).display !== 'none',
         '返回后恢复底部页签');
      mp.hidden = false;
      var mpBackDisplay = win.getComputedStyle(mp).display;
      mp.hidden = mpWasHidden;
      ok(mpBackDisplay !== 'none',
         '返回后恢复迷你播放器');

      /* 提示词 → 本地推荐 agent → 选 BPM → 生成 craft */
      click(doc.querySelector('.tab[data-tab="improv"]'));
      var craftBefore = win.Crafts.list().length;
      $('improvPrompt').value = '凄凉的秋天，一个老人扫落叶';
      var evPrompt = doc.createEvent('HTMLEvents'); evPrompt.initEvent('input', true, false);
      $('improvPrompt').dispatchEvent(evPrompt);
      click($('btnImprovGen'));
      ok($('recPanel').hidden === false, '提示词生成本地推荐面板');
      ok(doc.querySelectorAll('#recBpmRow .chip').length === 5, '推荐给出 top5 速度');
      ok(!!$('recDrumSelect') && $('recDrumSelect').options.length > 0,
         '推荐面板可以选择鼓机');
      ok(!!$('recRhythmSelect') && $('recRhythmSelect').options.length > 0,
         '推荐面板可以选择节奏型');
      ok(!!$('recProgressionSelect') && $('recProgressionSelect').options.length > 0,
         '推荐面板可以选择和弦走向');
      ok($('btnRecGenerate').disabled === true,
         '还没选速度时不能直接生成');
      ok(!!$('recBpmInput') && $('recBpmInput').value === '',
         '速度有可输入的数字框');
      var recBest = win.ImprovUI.state.recommendation.bpm;
      ok(Number($('recBpmBest').textContent) === recBest,
         '单独显示一个推荐速度（不是 Top5）：' + $('recBpmBest').textContent + ' BPM');
      click($('btnUseRecBpm'));
      ok(Number($('recBpmInput').value) === recBest &&
         win.ImprovUI.state.recDraft.bpm === recBest,
         '一键填入推荐速度');
      ok(win.getComputedStyle($('recBpmRow')).flexWrap === 'wrap',
         '推荐速度按钮在窄屏会换行');
      var bpmChips = doc.querySelectorAll('#recBpmRow .chip');
      var bpmRowRect = $('recBpmRow').getBoundingClientRect();
      var bpmInside = true;
      for (var bc = 0; bc < bpmChips.length; bc++) {
        var bcr = bpmChips[bc].getBoundingClientRect();
        if (bcr.right > bpmRowRect.right + 1 || bcr.left < bpmRowRect.left - 1) bpmInside = false;
      }
      ok(bpmInside, 'top5 五个速度按钮都在面板宽度内，没有被裁掉');
      var progOptions = $('recProgressionSelect').options;
      var altProgId = progOptions[1] ? progOptions[1].value : progOptions[0].value;
      $('recProgressionSelect').value = altProgId;
      var evRecSel = doc.createEvent('HTMLEvents'); evRecSel.initEvent('change', true, false);
      $('recProgressionSelect').dispatchEvent(evRecSel);
      ok(win.ImprovUI.state.recDraft.progressionId === altProgId,
         '选择和弦走向只更新草稿');
      var recBpm = doc.querySelector('#recBpmRow .chip');
      var chosenBpm = Number(recBpm.textContent.split(' ')[0]);
      click(recBpm);
      ok(win.ImprovUI.state.recDraft.bpm === chosenBpm,
         '点 Top5 速度记录在草稿里：' + chosenBpm + ' BPM');
      $('recBpmInput').value = '67';
      var evBpmInput = doc.createEvent('HTMLEvents'); evBpmInput.initEvent('input', true, false);
      $('recBpmInput').dispatchEvent(evBpmInput);
      chosenBpm = 67;
      ok(win.ImprovUI.state.recDraft.bpm === 67,
         '可以直接输入任意 BPM（67）');
      ok(win.Crafts.list().length === craftBefore,
         '只选速度/输入 BPM 不会立即生成');
      ok($('btnRecGenerate').disabled === false,
         '输入有效速度后生成按钮可用');
      click($('btnRecGenerate'));
      ok(win.ImprovUI.state.chosenBpm === chosenBpm,
         '确认生成后记录用户输入的 BPM');
      ok(win.Crafts.list().length === craftBefore + 1, '确认生成后写入一条 craft');
      var newCraft = win.Crafts.list()[0];
      ok(newCraft.prompt === '凄凉的秋天，一个老人扫落叶' &&
         newCraft.chosen.bpm === chosenBpm &&
         newCraft.chosen.progressionId === altProgId,
         'craft 保存了提示词、用户选择的速度和走向');
      ok(newCraft.versions && newCraft.versions.length === 1,
         '新 craft 带有初版版本记录');
      win.Band.stop();
      $('improvPrompt').value = '';
      $('improvPrompt').dispatchEvent(evPrompt);

      click(doc.querySelector('.tab[data-tab="band"]'));

      /* BPM 与点速 */
      var b0 = win.Band.state.bpm;
      click($('bpmPlus'));
      ok(win.Band.state.bpm === b0 + 1, '+1 生效：' + win.Band.state.bpm);
      click($('bpmMinus')); click($('bpmMinus'));
      ok(win.Band.state.bpm === b0 - 1, '-1 生效：' + win.Band.state.bpm);
      $('bpmRange').value = '150';
      var ev3 = doc.createEvent('HTMLEvents'); ev3.initEvent('input', true, false);
      $('bpmRange').dispatchEvent(ev3);
      ok(win.Band.state.bpm === 150, '拖动速度条生效：' + win.Band.state.bpm);
      click($('btnTap')); click($('btnTap')); click($('btnTap'));
      ok(win.Band.state.bpm === 240, 'TAP 连点被钳到上限 240（实际 ' + win.Band.state.bpm + '）');
      /* 改过的速度也要落库（下次打开接着用） */
      ok(win.Store.getSetting('bpm', '') === String(win.Band.state.bpm),
         'BPM 已存为设置：' + win.Store.getSetting('bpm', '-') + ' / 当前 ' + win.Band.state.bpm);
      ok(win.Store.getSetting('on.drums', '') === (win.Band.state.drumsOn ? '1' : '0'), '鼓机启用状态已存');
      ok(win.Store.getSetting('on.backing', '') === (win.Band.state.backingOn ? '1' : '0'), '伴奏启用状态已存');

      click(doc.querySelector('.tab[data-tab="band"]'));
      /* 只有和弦页签该有卡片 */
      /* 切回和弦页签 */
      click(doc.querySelector('.tab[data-tab="chord"]'));
      ok(win.CHORD_STATE.tab === 'chord' && doc.querySelectorAll('.card').length > 0,
         '切回和弦页签后卡片仍在（' + doc.querySelectorAll('.card').length + ' 张）');
    } catch (e) {
      fails++;
      lines.push('EXCEPTION: ' + e.message + '\n' + (e.stack || ''));
    }

    lines.push('');
    lines.push(fails === 0 ? 'UI_TESTS_PASSED' : ('UI_TESTS_FAILED: ' + fails));
    document.getElementById('out').textContent = lines.join('\n');
  };
})();
</script>
</body>
</html>
